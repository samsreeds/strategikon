  </style>
  <rect class="bg" width="32" height="32" rx="6"/>
  <line class="pole" x1="9" y1="4" x2="9" y2="29" stroke-width="2.6" stroke-linecap="round"/>
  <path class="flag" d="M10.3 5.5 H27 L22.5 11.5 L27 17.5 H10.3 Z"/>
