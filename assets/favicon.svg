<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 旗（バンドン）：竿と、先の分かれた四角い旗 -->
  <style>
    .bg { fill: #fbfaf7; }
    .pole { stroke: #3a2a20; }
    .flag { fill: #8a3b12; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1b1a18; }
      .pole { stroke: #e8dccf; }
