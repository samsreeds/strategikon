<svg xmlns="http://www.w3.org/2000/svg" class="plate" viewBox="0 0 520 722" role="img" aria-labelledby="b03-p094-acies-13-17-title b03-p094-acies-13-17-desc">
<title id="b03-p094-acies-13-17-title">第3巻第10章 側面防護兵と包囲兵の図（Acies XIII–XVII）</title>
<desc id="b03-p094-acies-13-17-desc">Scheffer 1664, 巻末の図 Pag.94 Acies XIII–XV, Pag.95 Acies XVI–XVII（MDZ 画像 #671 下、BSB urn:nbn:de:bvb:12-bsb11088428-7）をもとに作図。本文は第3巻第10章の5つの小見出し（p.94–95、画像 #225–#226）。原典は線と文字だけの模式図で、見出しと図の切れ目があいまいなため（notes/plates.md §3.8）、版面の並びのまま1枚に描いた。ΣΙΨΟ（逆並び）は敵の正面、ΟΨΙΣ は味方の正面か（推測）。縦書きのラベルの向きは原典どおり。位置と線の長さはおおよそ。</desc>
<style>
  svg.plate { color: var(--plate-ink, #1f1d1a); }
  @media (prefers-color-scheme: dark) { svg.plate { color: var(--plate-ink, #ece8e1); } }
  .plate text { fill: currentColor; font-family: "Times New Roman", "Noto Serif", serif; }
  .plate .g { font-size: 17px; }
  .plate .head { font-size: 15px; letter-spacing: 0.06em; }
  .plate .pag { font-size: 12px; opacity: 0.7; }
  .plate .lab-up { font-size: 15px; }
  .plate .lab { font-size: 13px; font-style: italic; }
  .plate .mk { font-size: 12px; }
  .plate .rule, .plate .frame { stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: square; }
  .plate .dash { stroke: currentColor; stroke-width: 1.6; stroke-dasharray: 3 4; fill: none; }
  .plate .ring { stroke: currentColor; stroke-width: 1.2; fill: none; }
  .plate .dot { fill: currentColor; stroke: none; }
</style>
