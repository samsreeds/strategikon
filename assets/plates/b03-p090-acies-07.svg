<svg xmlns="http://www.w3.org/2000/svg" class="plate" viewBox="0 0 454 521" role="img" aria-labelledby="b03-p090-acies-07-title b03-p090-acies-07-desc">
<title id="b03-p090-acies-07-title">第3巻第8章 イッリュリキアノイのメロス（Acies VII）</title>
<desc id="b03-p090-acies-07-desc">Scheffer 1664, 巻末の図 Acies VII（MDZ 画像 #669 下、BSB urn:nbn:de:bvb:12-bsb11088428-7）をもとに作図。本文は第3巻第8章（p.90、画像 #221）。見出しは「イッリュリキアノイのメロス。包囲兵の旗1つか2つ」と読める（上付きの字の読みに自信がない）。右の2列は包囲兵か（推測）。最下行の字は原典では ∂ に似た形。記号の数と並びは原典どおり。位置は原典の画像から測った座標を縮めたもの（等間隔にはそろえていない）。第3巻の図の記号の多くは、写本に凡例がなく意味が決められない（notes/plates.md §2）。</desc>
