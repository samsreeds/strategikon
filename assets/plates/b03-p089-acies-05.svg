<svg xmlns="http://www.w3.org/2000/svg" class="plate" viewBox="0 0 382 440" role="img" aria-labelledby="b03-p089-acies-05-title b03-p089-acies-05-desc">
<title id="b03-p089-acies-05-title">第3巻第6章 メロスの配置（Acies V）</title>
<desc id="b03-p089-acies-05-desc">Scheffer 1664, 巻末の図 Acies pertinens ad pag. 89.（MDZ 画像 #668 下半分、BSB urn:nbn:de:bvb:12-bsb11088428-7）をもとに作図。本文は第3巻第6章（p.89、画像 #220。欄外の標識 Acies V）。図に V の番号はない。k の行の上の小さな s 形の印は、原典の小活字（ς か ε か不明）を小さく描いた。記号の数と並びは原典どおり。位置は原典の画像から測った座標を縮めたもの（等間隔にはそろえていない）。第3巻の図の記号の多くは、写本に凡例がなく意味が決められない（notes/plates.md §2）。</desc>
<style>
