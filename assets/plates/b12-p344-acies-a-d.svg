<svg xmlns="http://www.w3.org/2000/svg" class="plate" viewBox="0 0 420 600" role="img" aria-labelledby="t d">
<title id="t">第12巻第8章第20節の図 A–D（横の戦列と、一重・二重・四重の縦の密集隊）</title>
<desc id="d">Scheffer 1664, 巻末の図 Pag.344 Acies A–C, Pag.345 Acies D（MDZ 画像 #675 上半分、BSB urn:nbn:de:bvb:12-bsb11088428-7）をもとに作図。本文は第12巻第8章第20節（p.344–345、画像 #475–#476）。ΜΕΤΟΠΟΝ（正面）は版面の綴りのまま。B の枠にはラベルがない（原典どおり）。原典では枠の辺ごとに線の太さが違うが、ここでは同じ太さで描いた。</desc>
<style>
  svg.plate { color: var(--plate-ink, #1f1d1a); }
  @media (prefers-color-scheme: dark) { svg.plate { color: var(--plate-ink, #ece8e1); } }
  .plate text { fill: currentColor; font-family: "Times New Roman", "Noto Serif", serif; }
  .plate .head { font-size: 15px; letter-spacing: 0.06em; }
  .plate .pag { font-size: 12px; opacity: 0.7; }
  .plate .lab { font-size: 15px; }
  .plate .rule, .plate .frame { stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: square; }
</style>
